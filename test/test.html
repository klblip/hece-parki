<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hece Parkı — Tarayıcı Testleri</title>
<style>
  :root{--ok:#1f8a4c;--no:#c0392b;--ink:#233;--line:#dbe4ee}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#f6f9fc}
  h1{font-size:22px;margin:0 0 4px}
  .alt{color:#5b6b7c;font-size:14px;margin-bottom:18px}
  #ozet{font-size:18px;font-weight:700;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:16px}
  #ozet.ok{color:var(--ok);border-color:#bfe6cf;background:#f2fbf5}
  #ozet.no{color:var(--no);border-color:#f0c9c4;background:#fdf4f3}
  table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#eef4fa;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:0}
  .g{color:var(--ok);font-weight:700}
  .k{color:var(--no);font-weight:700}
  code{background:#f2f5f8;padding:1px 5px;border-radius:5px;font-size:13px}
  .bolum{font-weight:700;background:#f7fafc}
</style>
</head>
<body>
<h1>Tarayıcı testleri</h1>
<div class="alt">Kanonik veri, heceleme, havuzlar ve soru üreticisi. Sayfa çevrimdışı çalışır.</div>
<div id="ozet">Çalışıyor...</div>
<table>
  <thead><tr><th style="width:52px">#</th><th>Test</th><th style="width:70px">Sonuç</th><th style="width:42%">Ayrıntı</th></tr></thead>
  <tbody id="govde"></tbody>
</table>

<script src="../assets/veri.js"></script>
<script src="../assets/fonem.js"></script>
<script src="../assets/sesler/manifest.js"></script>
<script src="../okuma-bayrami/js/yardim.js"></script>
<script src="../okuma-bayrami/js/veri.js"></script>
<script src="../okuma-bayrami/js/soru.js"></script>
<script>
"use strict";

var SONUC = { toplam: 0, gecen: 0, kalan: 0, hatalar: [] };
var govde = document.getElementById("govde");
var sira = 0;

function bolum(baslik) {
  var tr = document.createElement("tr");
  tr.className = "bolum";
  tr.innerHTML = '<td colspan="4">' + baslik + "</td>";
  govde.appendChild(tr);
}
function test(ad, fn) {
  sira++;
  SONUC.toplam++;
  var gecti = false, ayrinti = "";
  try {
    var r = fn();
    if (r === true) { gecti = true; }
    else if (r === false) { ayrinti = "false döndü"; }
    else { ayrinti = String(r == null ? r : r); }
  } catch (e) {
    ayrinti = "HATA: " + (e && e.message ? e.message : e);
  }
  if (gecti) SONUC.gecen++; else { SONUC.kalan++; SONUC.hatalar.push(ad + " — " + ayrinti); }
  var tr = document.createElement("tr");
  tr.innerHTML = '<td>' + sira + '</td><td>' + ad + '</td><td class="' + (gecti ? "g" : "k") + '">' +
    (gecti ? "GEÇTİ" : "KALDI") + '</td><td>' + ayrinti + "</td>";
  govde.appendChild(tr);
}
function esit(a, b, ad) {
  return function () {
    return JSON.stringify(a) === JSON.stringify(b) ? true : "beklenen: " + JSON.stringify(b) + " · gelen: " + JSON.stringify(a);
  };
}
/* yardımcı: bir kümenin tüm harfleri izinli mi */
function izinliMi(metin, kume) {
  var s = lower(metin);
  for (var i = 0; i < s.length; i++) {
    if (TR_ALPHA.indexOf(s[i]) > -1 && kume.indexOf(s[i]) < 0) return false;
  }
  return true;
}

/* ------------------------------------------------------------------ */
bolum("1 · Kanonik veri (assets/veri.js)");

test("5 resmî harf grubu var", function () {
  return V.GROUPS.length === 5 || "grup sayısı: " + V.GROUPS.length;
});
test("Grup sırası TYMM 2026 ile aynı", esit(
  V.GROUPS.map(function (g) { return g.letters.join(""); }),
  ["anetil", "okurım", "üsöydz", "çbgcş", "phvğfj"]
));
test("Toplam 29 harf, tekrar yok", function () {
  var hepsi = V.GROUPS.reduce(function (a, g) { return a.concat(g.letters); }, []);
  var tek = hepsi.filter(function (h, i) { return hepsi.indexOf(h) === i; });
  return (hepsi.length === 29 && tek.length === 29) || "toplam " + hepsi.length + " / tek " + tek.length;
});
test("Kümülatif grup boyutları 6-12-18-23-29", esit([6, 12, 18, 23, 29], [6, 12, 18, 23, 29]));
test("Türk alfabesinde olmayan harf yok", function () {
  var kotu = V.TUM_HARFLER.filter(function (h) { return V.ALFABE.indexOf(h) < 0; });
  return kotu.length === 0 || "fazla: " + kotu.join(",");
});
test("Kelime bankası küçük harfli ve Türk alfabesinde", function () {
  var kotu = V.SOZLUK.filter(function (o) {
    return o.w !== o.w.toLocaleLowerCase("tr-TR") ||
      o.w.split("").some(function (h) { return V.ALFABE.indexOf(h) < 0; });
  });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 3).map(function (o) { return o.w; }).join(", ");
});
test("Her kelime ilk okunabildiği gruba atanmış", function () {
  var kotu = V.SOZLUK.filter(function (o) { return o.g < 1 || o.g > 5; });
  return kotu.length === 0 || "hatalı grup: " + kotu.length;
});
test("1. grup kelimeleri yalnızca a,n,e,t,i,l ile yazılıyor", function () {
  var g1 = V.GROUPS[0].letters;
  var kotu = V.SOZLUK.filter(function (o) { return o.g === 1 && !izinliMi(o.w, g1); });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 3).map(function (o) { return o.w; }).join(", ");
});
test("Cümle bankası boş değil ve noktalaması var", function () {
  if (!V.CUMLELER.length) return "cümle yok";
  var noktasiz = V.CUMLELER.filter(function (c) { return !/[.!?]$/.test(c.s); });
  return noktasiz.length === 0 || noktasiz.length + " cümlede son noktalama yok: " + noktasiz[0].s;
});

/* ------------------------------------------------------------------ */
bolum("2 · Heceleme kuralı (assets/veri.js → hecele)");

var BEKLENEN = {
  "aile": ["a", "i", "le"], "saat": ["sa", "at"], "ana": ["a", "na"], "anne": ["an", "ne"],
  "kalem": ["ka", "lem"], "domates": ["do", "ma", "tes"], "tren": ["tren"], "göz": ["göz"],
  "mutlu": ["mut", "lu"], "yüksek": ["yük", "sek"], "altın": ["al", "tın"], "ırmak": ["ır", "mak"],
  "deniz": ["de", "niz"], "şimşek": ["şim", "şek"], "aslan": ["as", "lan"]
};
Object.keys(BEKLENEN).forEach(function (w) {
  test("hecele(\"" + w + "\") = " + BEKLENEN[w].join("-"), function () {
    var g = V.hecele(w);
    return JSON.stringify(g) === JSON.stringify(BEKLENEN[w]) || "gelen: " + g.join("-");
  });
});
test("Hiçbir hece sesli harfsiz değil", function () {
  var kotu = [];
  V.SOZLUK.forEach(function (o) {
    o.heceler.forEach(function (h) {
      if (!h.split("").some(function (c) { return V.SESLI.indexOf(c) > -1; })) kotu.push(o.w + ":" + h);
    });
  });
  return kotu.length === 0 || kotu.slice(0, 5).join(", ");
});
test("Kapalı heceler açık hecelerden önce sıralanıyor", function () {
  var liste = V.heceSirala(["le", "at", "na", "el", "ki"]);
  var ilkAcik = liste.findIndex(function (h) { return V.heceTuru(h) === "acik"; });
  var sonKapali = -1;
  liste.forEach(function (h, i) { if (V.heceTuru(h) === "kapali") sonKapali = i; });
  return sonKapali < ilkAcik || "sıra: " + liste.join(",");
});

/* ------------------------------------------------------------------ */
bolum("3 · okuma-bayrami veri adaptörü");

test("Adaptör 29 harf taşıyor", function () {
  var n = GROUPS.reduce(function (a, g) { return a + g.letters.length; }, 0);
  return n === 29 || "gelen: " + n;
});
test("Adaptör kelime/cümle sayısı kanonik ile aynı", function () {
  if (WORDS.length !== V.SOZLUK.length) return "kelime " + WORDS.length + " ≠ " + V.SOZLUK.length;
  if (SENTENCES.length !== V.TUM_CUMLELER.length) return "cümle " + SENTENCES.length + " ≠ " + V.TUM_CUMLELER.length;
  return true;
});
test("Harf ADI sözlüğü kaldırıldı", function () {
  return typeof window.HARF_ADI === "undefined" || "HARF_ADI hâlâ tanımlı";
});

/* ------------------------------------------------------------------ */
bolum("4 · Havuzlar ve soru üreticisi (grup 1)");

S.letters = GROUPS[0].letters.slice();
S.types = { harf: true, ilkses: true, hece: true, resim: true, kelime: true, eksik: true };
save();

test("Grup 1'de 20+ kelime var", function () {
  return poolWords().length >= 20 || "kelime: " + poolWords().length;
});
test("Grup 1'de cümle oyunu kapalı", function () {
  return cumlelerAcik() === false || "cumlelerAcik true döndü";
});
test("Grup 2 eklenince cümle oyunu açılıyor", function () {
  S.letters = GROUPS[0].letters.concat(GROUPS[1].letters);
  var acik = cumlelerAcik();
  S.letters = GROUPS[0].letters.slice();
  return acik === true || "cumlelerAcik false döndü";
});
test("Hece havuzu gerçek kelimelerden türetiliyor", function () {
  var havuz = poolSyllables();
  var gercek = {};
  poolWords().forEach(function (o) { hecele(o.w).forEach(function (h) { gercek[h] = 1; }); });
  var kotu = havuz.filter(function (h) { return !gercek[h]; });
  return kotu.length === 0 || "uydurma: " + kotu.slice(0, 5).join(",");
});
test("Hece havuzunda 2+ harfli hece var", function () {
  var n = poolSyllables().filter(function (h) { return h.length >= 2; }).length;
  return n >= 5 || "adet: " + n;
});
test("qIlkses kelimeyi yazıyla göstermiyor", function () {
  for (var i = 0; i < 40; i++) {
    var q = qIlkses();
    if (!q) return "soru üretilemedi";
    if ("cap" in q.visual) return "cap alanı hâlâ var";
    if (!q.visual.value) return "boş emoji";
  }
  return true;
});
test("qHarf harf adı söylemiyor", function () {
  for (var i = 0; i < 20; i++) {
    var q = qHarf();
    if (!q) return "soru üretilemedi";
    if (q.say !== "") return "say dolu: " + q.say;
    if (!q.harf) return "harf alanı yok";
  }
  return true;
});
test("qEksik ilk harfi de sorabiliyor", function () {
  var ilk = 0;
  for (var i = 0; i < 200; i++) {
    var q = qEksik();
    if (q && q.visual.value.charAt(0) === "_") ilk++;
  }
  return ilk > 0 || "200 denemede ilk harf hiç sorulmadı";
});
test("qEksik tekrar eden harfli kelimeyi de kullanıyor", function () {
  var tekrarli = poolWords().filter(function (o) {
    return o.w.length >= 3 && o.w.split("").some(function (h, i) { return o.w.indexOf(h) !== i; });
  });
  return tekrarli.length > 0 || "tekrarli kelime yok";
});
test("Resim sütununda yazı değil emoji var", function () {
  var kotu = V.SOZLUK.filter(function (o) {
    var s = String(o.e || "").replace(/[0-9]\uFE0F?\u20E3/g, ""); /* 7️⃣ gibi sayı emojileri serbest */
    return s && /[0-9a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(s);
  });
  return kotu.length === 0 || "yazı gibi görünen: " + kotu.slice(0, 3).map(function (o) { return o.w + "=" + o.e; }).join(", ");
});
test("Resimli soruda resim ile cevap aynı kelimeyi gösteriyor", function () {
  var emap = {};
  WORDS.forEach(function (o) { emap[o.w] = o.e; });
  for (var i = 0; i < 60; i++) {
    var q = qResim();
    if (!q) return "resim sorusu üretilemedi";
    if (emap[q.reveal] !== q.visual.value) return q.reveal + " için resim " + q.visual.value;
    var emojiler = q.options.map(function (o) { return emap[o.label]; }).filter(Boolean);
    var tek = emojiler.filter(function (e, j) { return emojiler.indexOf(e) === j; });
    if (tek.length !== emojiler.length) return "aynı resim iki seçenekte: " + emojiler.join(",");
  }
  return true;
});
test("Tüm soru tipleri üretilebiliyor", function () {
  var tipler = { harf: 0, ilkses: 0, hece: 0, resim: 0, kelime: 0, eksik: 0 };
  for (var i = 0; i < 300; i++) {
    var q = nextQuestion();
    if (!q) return "soru üretilemedi (i=" + i + ")";
    tipler[q.type]++;
    if (q.options.length < 2) return q.type + " seçenek sayısı " + q.options.length;
    if (q.answer < 0 || q.answer >= q.options.length) return q.type + " cevap indeksi hatalı";
  }
  var eksik = Object.keys(tipler).filter(function (k) { return tipler[k] === 0; });
  return eksik.length === 0 || "hiç üretilmeyen: " + eksik.join(",");
});
test("Seçenekler doğru cevabı bir kez içeriyor", function () {
  for (var i = 0; i < 100; i++) {
    var q = nextQuestion();
    if (!q) return "soru yok";
    var etiket = q.options.map(function (o) { return o.emoji ? "e:" + o.emoji : "l:" + o.label; });
    var dogru = q.reveal;
    var sayi = q.options.filter(function (o) {
      if (q.type === "resim" || q.type === "kelime") return o.label === dogru;
      return o.label === dogru;
    }).length;
    if (sayi !== 1) return q.type + " doğru seçenek sayısı: " + sayi + " (" + etiket.join("|") + ")";
  }
  return true;
});
test("Grup 1'de sorular yalnızca öğretilen harfleri kullanıyor", function () {
  var g1 = GROUPS[0].letters;
  for (var i = 0; i < 200; i++) {
    var q = nextQuestion();
    if (!q) return "soru yok";
    var metin = q.options.map(function (o) { return o.label || ""; }).join(" ") + " " + (q.visual.value || "");
    if (q.visual.type === "emoji") continue; /* resim sorusunda metin yok */
    if (!izinliMi(metin, g1)) return "izinli olmayan harf: " + metin;
  }
  return true;
});

/* ------------------------------------------------------------------ */
bolum("5 · Fonem motoru");

test("Ünlü harf sesli olarak işaretli", function () {
  return (Fonem.sesliMi("a") && Fonem.sesliMi("ü") && Fonem.sesliMi("ı")) || "ünlü tanınmadı";
});
test("Sessiz harf ünlü sayılmıyor", function () {
  return (!Fonem.sesliMi("k") && !Fonem.sesliMi("ş")) || "sessiz ünlü sayıldı";
});
test("Sessiz harf sentezi tanınıyor", function () {
  var k = Fonem.sentez("k"), s = Fonem.sentez("s"), m = Fonem.sentez("m");
  return (k && s && m) || "k=" + k + " s=" + s + " m=" + m;
});
test("Ünlü harf sentezlenmiyor (TTS'e bırakılıyor)", function () {
  return Fonem.sentez("a") === false || "ünlü sentezlendi";
});
test("Ses manifesti yapısı geçerli", function () {
  var m = window.ORTAK_SES_KAYITLARI;
  if (!m) return "ORTAK_SES_KAYITLARI yok";
  var turler = ["fonem", "hece", "kelime"];
  for (var i = 0; i < turler.length; i++) {
    var t = turler[i];
    if (!m[t] || typeof m[t] !== "object") return t + " bölümü yok";
    var anahtarlar = Object.keys(m[t]);
    for (var j = 0; j < anahtarlar.length; j++) {
      var k = anahtarlar[j], yol = String(m[t][k]);
      if (yol.indexOf("/" + t + "/") < 0 || !/\.mp3$/.test(yol)) return t + "." + k + " yolu hatalı: " + yol;
      if (t === "fonem" && (k.length !== 1 || V.ALFABE.indexOf(k) < 0)) return "fonem anahtarı hatalı: " + k;
    }
  }
  return true;
});

/* ------------------------------------------------------------------ */
bolum("6 · İçerik lint'i (kelime ve cümle bankası)");

function kumulatif(n) {
  var s = [];
  for (var i = 0; i < n; i++) s = s.concat(V.GROUPS[i].letters);
  return s;
}
test("Kelime bankasında tekrar yok", function () {
  var w = V.SOZLUK.map(function (o) { return o.w; });
  var tek = w.filter(function (x, i) { return w.indexOf(x) === i; });
  return (w.length === tek.length) || (w.length - tek.length) + " tekrar var";
});
test("Cümle bankasında tekrar yok", function () {
  var c = V.CUMLELER.map(function (o) { return o.s; });
  var tek = c.filter(function (x, i) { return c.indexOf(x) === i; });
  return (c.length === tek.length) || (c.length - tek.length) + " tekrar var";
});
test("Her kelime ilk okunabildiği grupta", function () {
  var kotu = V.SOZLUK.filter(function (o) {
    if (!V.harfUyar(kumulatif(o.g), o.w)) return true;            /* kendi grubunda okunamıyor */
    if (o.g > 1 && V.harfUyar(kumulatif(o.g - 1), o.w)) return true; /* önceki grupta zaten okunuyor */
    return false;
  });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 4).map(function (o) { return o.w + "→" + o.g; }).join(", ");
});
test("Her cümlenin grubu ilk okunabildiği grupla aynı", function () {
  var kotu = V.CUMLELER.filter(function (o) {
    if (!V.harfUyar(kumulatif(o.g), o.s)) return true;
    if (o.g > 1 && V.harfUyar(kumulatif(o.g - 1), o.s)) return true;
    return false;
  });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 3).map(function (o) { return o.s + "→" + o.g; }).join(" | ");
});
test("Kelime 10 harfi geçmiyor", function () {
  var uzun = V.SOZLUK.filter(function (o) { return o.w.length > 10; });
  return uzun.length === 0 || uzun.slice(0, 3).map(function (o) { return o.w; }).join(", ");
});
test("Cümleler 1-7 sözcük arasında", function () {
  var kotu = V.CUMLELER.filter(function (o) {
    var n = o.s.replace(/[.!?,]+/g, "").split(/\s+/).filter(Boolean).length;
    return n < 1 || n > 7;
  });
  return kotu.length === 0 || kotu.slice(0, 3).map(function (o) { return "\"" + o.s + "\""; }).join(", ");
});
test("Cümlelerde rakam ve yabancı harf yok", function () {
  var serbest = " .,!?'’\"-";
  var kotu = V.CUMLELER.filter(function (o) {
    var s = o.s.toLocaleLowerCase("tr-TR");
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (serbest.indexOf(c) > -1) continue;
      if (V.ALFABE.indexOf(c) < 0) return true;
    }
    return false;
  });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 3).map(function (o) { return o.s; }).join(" | ");
});
test("heceler alanı hecele() ile aynı", function () {
  var kotu = V.SOZLUK.filter(function (o) {
    return JSON.stringify(o.heceler) !== JSON.stringify(V.hecele(o.w));
  });
  return kotu.length === 0 || "hatalı: " + kotu.slice(0, 3).map(function (o) { return o.w; }).join(", ");
});

/* ------------------------------------------------------------------ */
bolum("7 · Oyun sayfaları (iframe · gerçek yükleme)");

var bekleyen = 0;
function iframeTest(ad, url, fn) {
  sira++; SONUC.toplam++; bekleyen++;
  var tr = document.createElement("tr");
  tr.innerHTML = '<td>' + sira + '</td><td>' + ad + '</td><td>…</td><td>yükleniyor</td>';
  govde.appendChild(tr);
  var f = document.createElement("iframe");
  f.setAttribute("title", ad);
  f.style.cssText = "position:absolute;left:-9999px;width:1024px;height:768px;border:0";
  f.src = url;
  var bitti = false;
  function sonuc(gecti, ayrinti) {
    if (bitti) return;
    bitti = true;
    if (gecti) SONUC.gecen++; else { SONUC.kalan++; SONUC.hatalar.push(ad + " — " + ayrinti); }
    tr.innerHTML = '<td>' + sira + '</td><td>' + ad + '</td><td class="' + (gecti ? "g" : "k") + '">' +
      (gecti ? "GEÇTİ" : "KALDI") + '</td><td>' + ayrinti + "</td>";
    bekleyen--;
    ozetYaz();
  }
  f.onload = function () {
    try {
      var r = fn(f.contentWindow, f.contentDocument);
      sonuc(r === true, r === true ? "" : String(r == null ? r : r));
    } catch (e) {
      sonuc(false, "HATA: " + (e && e.message ? e.message : e));
    }
  };
  f.onerror = function () { sonuc(false, "sayfa yüklenemedi"); };
  document.body.appendChild(f);
  setTimeout(function () { sonuc(false, "zaman aşımı (15 sn)"); }, 15000);
}

iframeTest("hece-rallisi: resmî 1. grup yüklü", "../oyunlar/hece-rallisi/index.html", function (w) {
  var D = w.__D;
  if (!D) return "__D yok";
  var harf = Array.from(D.harfler).join("");

bolum("8 · Çevrimdışılık (dış istek yok)");

function uzakIstekler(w, d) {
  var uzak = [];
  var host = String(w.location.host || "");
  function dis(u) {
    if (!/^https?:\/\//i.test(u)) return false;
    if (!host) return true;
    return u.indexOf("//" + host) < 0;
  }
  Array.prototype.forEach.call(d.querySelectorAll("[src],[href]"), function (e) {
    var u = e.getAttribute("src") || e.getAttribute("href") || "";
    if (dis(u)) uzak.push(u);
  });
  Array.prototype.forEach.call(d.styleSheets, function (ss) {
    var kurallar;
    try { kurallar = ss.cssRules; } catch (e) { return; }
    Array.prototype.forEach.call(kurallar || [], function (r) {
      if (r.cssText && /url\(\s*['"]?https?:/i.test(r.cssText)) uzak.push(r.cssText.slice(0, 100));
    });
  });
  try {
    w.performance.getEntriesByType("resource").forEach(function (r) {
      if (dis(r.name)) uzak.push(r.name);
    });
  } catch (e) { }
  return uzak;
}
