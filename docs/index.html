<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7ec8ff">
<title>Hece Parkı — Okuyorum</title>
<meta http-equiv="refresh" content="0; url=uygulama/index.html">
<link rel="canonical" href="uygulama/index.html">
<style>
  :root{--koyu:#234d63;--yesil:#1f7a4d;--sari:#f4b400}
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;padding:24px;display:grid;place-items:center;font-family:var(--dik-temel,"TTKB Dik Temel Abece","Segoe UI",Verdana,sans-serif);color:var(--koyu);background:linear-gradient(180deg,#7ec8ff 0%,#a8e6ff 45%,#d8f7c9 55%,#7ed957 100%)}
  main{width:min(560px,100%);padding:clamp(24px,5vw,40px);text-align:center;background:#fff;border-radius:28px;box-shadow:0 18px 40px rgba(20,60,90,.18)}
  .simge{font-size:clamp(48px,10vw,72px);line-height:1}
  h1{font-size:clamp(26px,6vw,40px);margin:10px 0 8px}
  p{font-size:clamp(17px,2.6vw,20px);line-height:1.55;margin:0 auto 18px;max-width:40ch}
  a{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--yesil);color:#fff;text-decoration:none;font-weight:700;font-size:19px}
  a:focus-visible{outline:4px solid var(--sari);outline-offset:4px}
</style>
</head>
<body>
  <main>
    <div class="simge" aria-hidden="true">🎓</div>
    <h1>Okuyorum’a yönlendiriliyorsunuz</h1>
    <p>Hece Parkı’nın ana uygulaması öğretmen uygulamasıdır. Otomatik açılmazsa aşağıdaki bağlantıyı kullanın.</p>
    <a href="uygulama/index.html">🎓 Okuyorum’u aç</a>
  </main>
  <script>location.replace("uygulama/index.html");</script>
</body>
</html>
